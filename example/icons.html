<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sui.css — SVG Icon System Example</title>
  <link rel="stylesheet" href="../dist/sui.min.css">
</head>
<body class="sui-bg sui-text">
  <main class="sui-container sui-py-12">
    <h1 class="sui-mb-4">SUI.css SVG Icon System</h1>
    <p class="sui-text-muted sui-mb-6">Semantic color variants including primary, success, warning, danger, and info tokens.</p>
    <div class="sui-flex sui-flex-wrap sui-gap-6 sui-items-center">
      <svg class="sui-icon sui-icon-lg sui-icon-primary" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg>
      <svg class="sui-icon sui-icon-lg sui-icon-success" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
      <svg class="sui-icon sui-icon-lg sui-icon-warning" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      <svg class="sui-icon sui-icon-lg sui-icon-danger" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18L18 6M6 6l12 12"/></svg>
      <svg class="sui-icon sui-icon-lg sui-icon-info" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4m0-4h.01"/></svg>
    </div>
  </main>
  <script defer src="../dist/sui.min.js"></script>
</body>
</html>
